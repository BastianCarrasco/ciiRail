<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrusel Full Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="carouselExample" class="carousel slide carousel-fade" data-bs-ride="false">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="imagenes/1.png" class="d-block w-100 img-fluid" alt="Imagen 1">
      </div>
      <div class="carousel-item">
        <img src="imagenes/2.png" class="d-block w-100 img-fluid" alt="Imagen 2">
      </div>
      <div class="carousel-item">
        <img src="imagenes/3.png" class="d-block w-100 img-fluid" alt="Imagen 3">
      </div>
      <div class="carousel-item">
        <img src="imagenes/4.png" class="d-block w-100 img-fluid" alt="Imagen 4">
      </div>
      <div class="carousel-item">
        <img src="imagenes/5.png" class="d-block w-100 img-fluid" alt="Imagen 5">
      </div>
      <div class="carousel-item">
        <img src="imagenes/6.png" class="d-block w-100 img-fluid" alt="Imagen 6">
      </div>
      <div class="carousel-item">
        <img src="imagenes/7.png" class="d-block w-100 img-fluid" alt="Imagen 7">
      </div>
    </div>
    
    <!-- Controles laterales -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
